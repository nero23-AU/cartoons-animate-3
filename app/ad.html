<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>html,body{margin:0;background:transparent;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100%}</style></head>
<body><script>
// Página de um banner Adsterra: ad.html?k=KEY&w=320&h=50 (roda no domínio do site, como o Adsterra exige)
var q = new URLSearchParams(location.search), k = (q.get('k') || '').replace(/[^a-f0-9]/gi, ''), w = +q.get('w') || 320, hh = +q.get('h') || 50;
window.atOptions = { key: k, format: 'iframe', height: hh, width: w, params: {} };
var s = document.createElement('script'); s.src = 'https://www.highperformanceformat.com/' + k + '/invoke.js'; document.body.appendChild(s);
</script></body></html>
